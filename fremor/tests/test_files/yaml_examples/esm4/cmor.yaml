cmor:
  start:
    *CMOR_START
  stop:
    *CMOR_STOP
  mip_era:
    'CMIP6'
  exp_json:
    'fremor/tests/test_files/CMOR_input_example.json'
  directories:
    pp_dir: !join [fremor/tests/test_files/ascii_files/mock_archive/cm6/, *FRE_STEM, /, DECK/, *name, /, *platform, -, *target, /, pp]
    table_dir: &table_dir
      'fremor/tests/test_files/cmip6-cmor-tables/Tables'
    outdir:
      'fremor/tests/test_files/iamnotreallyused/outdir/'
  table_targets:
    - table_name: 'Amon'
      variable_list:
        !join [*table_dir, '/', 'GFDL-ESM4_amip_CMOR-Amon.lst']
      freq:
      gridding:
        <<: *gr1
      target_components:
        - component_name: 'atmos_cmip'
          data_series_type: 'ts'
          chunk: *PP_CHUNK_A
        - component_name: 'atmos_level_cmip'
          data_series_type: 'ts'
          chunk: *PP_CHUNK_A
