name: test_integration_modulefiles

on:
  push:
    branches:
      - main
  pull_request:
    branches:

# cancel running jobs if theres a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SLURM_TAG: "slurm-25-05-3-1"
  SLURM_IMAGE_TAG: "25.05.3"
  SLURM_CLUSTER_TAG: "0.9.0"
  SLURM_IMAGE_TAR: /tmp/slurm-cluster-image.tar

jobs:
  modulefile-integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout Files
        uses: actions/checkout@v7

      - name: Set up required test submodule
        run: |
          git submodule update --init --force --depth 1 fremor/tests/test_files/cmip6-cmor-tables
          git -C fremor/tests/test_files/cmip6-cmor-tables reset --hard HEAD

      - name: Set up Miniforge environment from environment.yaml
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge,noaa-gfdl
          python-version: "3.11"
          conda-remove-defaults: true
          environment-file: environment.yaml
          activate-environment: fremor

      - name: Install newer Lmod and tcsh
        run: |
          conda install -y -c conda-forge "lmod>=8.7,<9" tcsh

      - name: Install fremor editable
        run: |
          pip install -e .

      - name: Run modulefile integration pytest
        run: |
          pytest --ignore fremor/tests/test_files/mip-cmor-tables fremor/tests/test_modulefile_integration.py -v

  modulefile-real-slurm-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Files
        uses: actions/checkout@v7

      - name: Set up required test submodule
        run: |
          git submodule update --init --force --depth 1 fremor/tests/test_files/cmip6-cmor-tables
          git -C fremor/tests/test_files/cmip6-cmor-tables reset --hard HEAD

      - name: Clone slurm-docker-cluster
        run: |
          git clone --branch "${SLURM_CLUSTER_TAG}" --depth 1 \
            https://github.com/giovtorres/slurm-docker-cluster.git \
            /tmp/slurm-docker-cluster

      - name: Restore cached slurm-cluster image
        id: cache-slurm-cluster
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SLURM_IMAGE_TAR }}
          key: slurm-cluster-${{ env.SLURM_IMAGE_TAG }}-${{ env.SLURM_TAG }}-v${{ env.SLURM_CLUSTER_TAG }}

      - name: Load cached slurm-cluster image
        if: steps.cache-slurm-cluster.outputs.cache-hit == 'true'
        run: docker load -i "${SLURM_IMAGE_TAR}"

      - name: Build base slurm-cluster image
        if: steps.cache-slurm-cluster.outputs.cache-hit != 'true'
        run: |
          docker build --progress=plain \
            --build-arg SLURM_TAG=${SLURM_TAG} \
            -t slurm-cluster:${SLURM_IMAGE_TAG} \
            /tmp/slurm-docker-cluster

      - name: Save slurm-cluster image to tarball
        if: steps.cache-slurm-cluster.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: docker save slurm-cluster:${SLURM_IMAGE_TAG} -o "${SLURM_IMAGE_TAR}"

      - name: Cache slurm-cluster image
        if: steps.cache-slurm-cluster.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SLURM_IMAGE_TAR }}
          key: slurm-cluster-${{ env.SLURM_IMAGE_TAG }}-${{ env.SLURM_TAG }}-v${{ env.SLURM_CLUSTER_TAG }}

      - name: Build fremor slurm test image
        run: |
          docker build --progress=plain \
            --build-arg BASE_IMAGE=slurm-cluster:${SLURM_IMAGE_TAG} \
            -t slurm-docker-cluster:${SLURM_IMAGE_TAG} \
            -f .github/docker/slurm-modulefile-tests/Dockerfile \
            .

      - name: Start Slurm cluster
        run: |
          cd /tmp/slurm-docker-cluster
          SLURM_VERSION=${SLURM_IMAGE_TAG} docker compose up -d --no-build

      - name: Register and wait for Slurm
        run: |
          set -euo pipefail
          cd /tmp/slurm-docker-cluster

          for _ in $(seq 1 30); do
            if docker exec slurmctld bash -c "scontrol ping" > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          docker exec slurmctld bash -c "/usr/bin/sacctmgr --immediate add cluster name=linux || /usr/bin/sacctmgr list cluster | grep -q linux"
          SLURM_VERSION=${SLURM_IMAGE_TAG} docker compose restart slurmdbd slurmctld c1 c2

          for _ in $(seq 1 30); do
            if docker exec slurmctld bash -c "sinfo --noheader | grep -q 'idle'" > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          docker exec slurmctld bash -c "scontrol ping"
          docker exec slurmctld bash -c "sinfo"
          docker exec slurmctld bash -c "sinfo --noheader | grep -q 'idle'"

      - name: Run real Slurm modulefile integration pytest
        run: |
          docker exec slurmctld bash -c '
            set -euo pipefail
            export USER="${USER:-$(id -un)}"
            export LOGNAME="${LOGNAME:-$USER}"
            set +u
            source /opt/conda/etc/profile.d/conda.sh
            conda activate /opt/conda/envs/fremor
            set -u
            cd /opt/fremor
            export FREMOR_TEST_REAL_SLURM=1
            export FREMOR_TEST_SLURM_SHARED_ROOT=/data
            pytest --ignore fremor/tests/test_files/mip-cmor-tables \
              fremor/tests/test_modulefile_integration.py::test_modulefile_real_slurm_jobs_cover_success_and_error_cases \
              -v
          '

      - name: Show Slurm logs
        if: always()
        run: |
          cd /tmp/slurm-docker-cluster
          SLURM_VERSION=${SLURM_IMAGE_TAG} docker compose logs --no-color || true

      - name: Stop Slurm cluster
        if: always()
        run: |
          cd /tmp/slurm-docker-cluster
          SLURM_VERSION=${SLURM_IMAGE_TAG} docker compose down -v
