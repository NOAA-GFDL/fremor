name: cache_slurm_image

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SLURM_TAG: "slurm-25-05-3-1"
  SLURM_IMAGE_TAG: "25.05.3"
  SLURM_CLUSTER_TAG: "0.9.0"
  SLURM_IMAGE_TAR: /tmp/slurm-cluster-image.tar

jobs:
  build-slurm-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone slurm-docker-cluster
        run: |
          git clone --branch "${SLURM_CLUSTER_TAG}" --depth 1 \
            https://github.com/giovtorres/slurm-docker-cluster.git \
            /tmp/slurm-docker-cluster

      - name: Build slurm-cluster image
        run: |
          docker build --progress=plain \
            --build-arg SLURM_TAG=${SLURM_TAG} \
            -t slurm-cluster:${SLURM_IMAGE_TAG} \
            /tmp/slurm-docker-cluster

      - name: Verify slurm-cluster image exists
        run: |
          if ! docker image inspect slurm-cluster:${SLURM_IMAGE_TAG} > /dev/null 2>&1; then
            echo "::error::Docker image 'slurm-cluster:${SLURM_IMAGE_TAG}' was not built."
            exit 1
          fi

      - name: Save slurm-cluster image to tarball
        run: docker save slurm-cluster:${SLURM_IMAGE_TAG} -o "${SLURM_IMAGE_TAR}"

      - name: Cache slurm-cluster image
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SLURM_IMAGE_TAR }}
          key: slurm-cluster-${{ env.SLURM_IMAGE_TAG }}-${{ env.SLURM_TAG }}-v${{ env.SLURM_CLUSTER_TAG }}
